name: Build and push container image (Forgejo Actions)

on:
  push:
    branches:
      - main
      - feat/bot-indicators

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: git.hut.techleads.com.br
  # Registry repository names must be lowercase.
  IMAGE_NAME: aeonsoftware/once-campfire

jobs:
  image:
    name: Build image on the host Podman socket
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No external actions: Galaxy runners cannot reach data.forgejo.org
      # (TLS timeout), so clone from our own Forgejo with the job token.
      # The job container talks to the HOST rootless Podman through the
      # runner-mounted /var/run/docker.sock — no DinD, no apt install.
      - name: Checkout (git, job token)
        shell: bash
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repo_host="${GITHUB_SERVER_URL#https://}"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${JOB_TOKEN}@${repo_host}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "$GITHUB_SHA"
          git rev-parse --short HEAD

      - name: Verify container CLI and socket
        shell: bash
        run: |
          set -eu
          command -v docker >/dev/null || { echo "docker CLI missing in runner image"; exit 1; }
          docker version --format '{{.Server.Version}}' >/dev/null
          docker info --format 'storage={{.Driver}} server={{.ServerVersion}}'

      - name: Log in to the container registry (only when REGISTRY_TOKEN is set)
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "${REGISTRY_USER:-$GITHUB_ACTOR}" --password-stdin
          else
            echo "::warning::REGISTRY_TOKEN is not set - skipping registry login and push (build-only run)."
          fi

      - name: Build image
        shell: bash
        run: |
          set -eu
          IID_FILE="${RUNNER_TEMP}/image-id"
          docker build \
            --iidfile "$IID_FILE" \
            --file Dockerfile \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}" \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --build-arg OCI_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg OCI_DESCRIPTION="Campfire is a web-based chat application with rooms, direct messages, file attachments, search, and bot integrations." \
            .
          # Capture the image id straight from the build (--iidfile) instead
          # of trusting the build-time tags to stick on the host Podman API.
          IMAGE_ID="$(tr -d ' \r\n' < "$IID_FILE")"
          case "$IMAGE_ID" in
            sha256:*) ;;
            *) IMAGE_ID="sha256:${IMAGE_ID}" ;;
          esac
          printf '%s\n' "$IMAGE_ID" > "$IID_FILE"
          # Re-tag from the captured id so later steps never depend on the
          # build-time tags.
          docker tag "$IMAGE_ID" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "$IMAGE_ID" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}"

      - name: Push image (skipped when REGISTRY_TOKEN is not set)
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}"
          else
            echo "::warning::REGISTRY_TOKEN is not set - skipping docker push."
          fi

      - name: Print image digest
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          IID_FILE="${RUNNER_TEMP}/image-id"
          IMAGE_ID="$(tr -d ' \r\n' < "$IID_FILE")"
          case "$IMAGE_ID" in
            sha256:*) ;;
            *) IMAGE_ID="sha256:${IMAGE_ID}" ;;
          esac
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          DIGEST=""
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            # RepoDigests is populated by the push above.
            DIGEST="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" | grep -o 'sha256:[0-9a-f]*' | head -n1 || true)"
          fi
          if [ -z "$DIGEST" ]; then
            # Build-only run (REGISTRY_TOKEN unset or push skipped): use the
            # image id captured from docker build --iidfile, no tag lookup.
            echo "::warning::no registry digest available (build-only run or push skipped); printing local image id instead."
            DIGEST="$IMAGE_ID"
          fi
          case "$DIGEST" in
            sha256:*) ;;
            *) DIGEST="sha256:${DIGEST}" ;;
          esac
          echo "IMAGE_DIGEST=${DIGEST}"

      - name: Remove local image
        if: always()
        shell: bash
        run: |
          set -eu
          docker image rm "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}" || true
          # Fall back to removing by id in case the tags never stuck.
          if [ -f "${RUNNER_TEMP}/image-id" ]; then
            IMAGE_ID="$(tr -d ' \r\n' < "${RUNNER_TEMP}/image-id" || true)"
            if [ -n "$IMAGE_ID" ]; then
              docker image rm -f "$IMAGE_ID" || true
            fi
          fi
